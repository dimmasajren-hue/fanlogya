<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fanlogya — Редактор</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #0a0a0a; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; }
        .container { max-width: 800px; margin: 30px auto; padding: 20px; }
        h1 { color: #f5a623; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 4px; color: #e0e8f0; font-weight: 600; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 12px; background: #1a1a30; border: 1px solid #2a2a4a;
            border-radius: 10px; color: #e0e0e0; font-size: 1rem;
        }
        .form-group textarea { min-height: 250px; resize: vertical; }
        .btn {
            padding: 12px 30px; border: none; border-radius: 30px; font-weight: 700;
            cursor: pointer; font-size: 1rem; transition: 0.3s; margin-right: 10px;
        }
        .btn-primary { background: #e94560; color: #fff; }
        .btn-primary:hover { background: #ff5a7a; }
        .btn-secondary { background: #1a1a3a; color: #e0e8f0; border: 1px solid #2a2a4a; }
        .btn-secondary:hover { background: #2a2a4a; }
        .status { padding: 12px 16px; border-radius: 10px; margin: 10px 0; display: none; }
        .status.error { background: #3a0a0a; border: 1px solid #e94560; display: block; }
        .status.success { background: #0f3460; border: 1px solid #e94560; display: block; }
        .status.loading { background: #1a1a3a; border: 1px solid #f5a623; display: block; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #1a1a3a; margin-bottom: 20px; }
        .header a { color: #e94560; text-decoration: none; font-weight: 600; }
        .preview-box { background: #0d0d1a; padding: 20px; border-radius: 16px; border: 1px solid #1a1a3a; margin-top: 20px; display: none; }
        .preview-box.active { display: block; }
        .emoji-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(45px, 1fr)); gap: 6px; background: #1a1a30; padding: 10px; border-radius: 10px; border: 1px solid #2a2a4a; margin-top: 6px; }
        .emoji-grid button { background: transparent; border: 1px solid #2a2a4a; border-radius: 8px; padding: 6px; font-size: 1.4rem; cursor: pointer; }
        .emoji-grid button:hover { background: #2a2a4a; border-color: #e94560; }
        #iconDisplay { font-size: 2rem; display: inline-block; width: 50px; text-align: center; }
        .flex { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <h1>✏️ Редактор</h1>
        <a href="index.html">← На главную</a>
    </div>

    <div id="userStatus">⏳ Проверка авторизации...</div>

    <div id="statusMessage" class="status"></div>

    <form id="loreForm" onsubmit="return false;">

        <div class="form-group">
            <label>👤 Твой ник</label>
            <input type="text" id="author" value="Фанат Fanlogya">
        </div>

        <div class="form-group">
            <label>📌 Название</label>
            <input type="text" id="title" placeholder="Название хронологии">
        </div>

        <div class="form-group">
            <label>🌌 Вселенная</label>
            <input type="text" id="universe" placeholder="Например: Half-Life × Backrooms">
        </div>

        <div class="form-group">
            <label>🎭 Жанр</label>
            <select id="genre">
                <option>Научная фантастика</option>
                <option selected>Психологический хоррор</option>
                <option>Альтернативный лор</option>
                <option>Киберпанк</option>
                <option>Фэнтези</option>
            </select>
        </div>

        <div class="form-group">
            <label>🎨 Иконка</label>
            <div class="flex">
                <span id="iconDisplay">🧬</span>
                <input type="text" id="icon" value="🧬" maxlength="2" style="width:80px;">
                <button type="button" class="btn btn-secondary" onclick="togglePicker()">📋 Выбрать</button>
            </div>
            <div id="emojiPicker" class="emoji-grid" style="display:none;">
                <button onclick="pickEmoji('🧬')">🧬</button>
                <button onclick="pickEmoji('🟠')">🟠</button>
                <button onclick="pickEmoji('☢️')">☢️</button>
                <button onclick="pickEmoji('🌀')">🌀</button>
                <button onclick="pickEmoji('🔥')">🔥</button>
                <button onclick="pickEmoji('👾')">👾</button>
                <button onclick="pickEmoji('🚀')">🚀</button>
                <button onclick="pickEmoji('🌑')">🌑</button>
                <button onclick="pickEmoji('📖')">📖</button>
                <button onclick="pickEmoji('⚡')">⚡</button>
                <button onclick="pickEmoji('💀')">💀</button>
                <button onclick="pickEmoji('🧛')">🧛</button>
                <button onclick="pickEmoji('🤖')">🤖</button>
                <button onclick="pickEmoji('👽')">👽</button>
                <button onclick="pickEmoji('🛸')">🛸</button>
                <button onclick="pickEmoji('🧙')">🧙</button>
                <button onclick="pickEmoji('🐉')">🐉</button>
                <button onclick="pickEmoji('🔮')">🔮</button>
            </div>
        </div>

        <div class="form-group">
            <label>📝 Текст хронологии</label>
            <textarea id="content" placeholder="Пиши текст... Используй # для заголовков, * для курсива, - для списков"></textarea>
        </div>

        <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:10px;">
            <button type="button" class="btn btn-primary" onclick="preview()">👁️ Предпросмотр</button>
            <button type="button" class="btn btn-primary" id="publishBtn" onclick="publish()">💾 Опубликовать</button>
            <button type="button" class="btn btn-secondary" onclick="clearAll()">🗑️ Очистить</button>
        </div>

    </form>

    <div id="previewArea" class="preview-box">
        <h3 style="color:#f5a623;">👁️ Предпросмотр</h3>
        <div id="previewContent"></div>
    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

<script>
// ============================================================
// 1. КОНФИГ FIREBASE (ВСТАВЬ СВОЙ!)
// ============================================================
const firebaseConfig = {
    apiKey: "AIzaSyCLNZLQA2c3dMtj5Z5tiLmEPD4zixi0gFc",
    authDomain: "fanlogya.firebaseapp.com",
    projectId: "fanlogya",
    storageBucket: "fanlogya.firebasestorage.app",
    messagingSenderId: "448128302344",
    appId: "1:448128302344:web:8f869fca95f1b00a1700bd"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

let currentUser = null;

// ============================================================
// 2. СЛЕДИМ ЗА ПОЛЬЗОВАТЕЛЕМ
// ============================================================
auth.onAuthStateChanged(user => {
    currentUser = user;
    const statusEl = document.getElementById('userStatus');
    if (user) {
        const name = user.displayName || user.email || 'Пользователь';
        statusEl.innerHTML = '✅ Ты вошёл как <strong>' + name + '</strong>';
        document.getElementById('publishBtn').disabled = false;
    } else {
        statusEl.innerHTML = '❌ Ты не вошёл в аккаунт. <a href="login.html" style="color:#e94560;">Войти</a>';
        document.getElementById('publishBtn').disabled = true;
    }
});

// ============================================================
// 3. ЛОГИКА
// ============================================================

function togglePicker() {
    const p = document.getElementById('emojiPicker');
    p.style.display = p.style.display === 'none' ? 'grid' : 'none';
}

function pickEmoji(e) {
    document.getElementById('icon').value = e;
    document.getElementById('iconDisplay').textContent = e;
    document.getElementById('emojiPicker').style.display = 'none';
}

// Обновляем иконку при ручном вводе
document.getElementById('icon').addEventListener('input', function() {
    document.getElementById('iconDisplay').textContent = this.value || '📖';
});

// ===== ПРЕДПРОСМОТР =====
function preview() {
    const title = document.getElementById('title').value || 'Без названия';
    const icon = document.getElementById('icon').value || '📖';
    const content = document.getElementById('content').value || 'Напиши текст...';
    const universe = document.getElementById('universe').value || 'Неизвестная вселенная';
    const genre = document.getElementById('genre').value;
    const author = document.getElementById('author').value || 'Аноним';

    let html = `
        <div style="display:flex; align-items:center; gap:16px; margin-bottom:16px; flex-wrap:wrap;">
            <span style="font-size:3.5rem;">${icon}</span>
            <div>
                <h2 style="color:#f5a623; font-size:1.6rem;">${title}</h2>
                <p style="color:#8899aa;">${universe}</p>
                <span style="background:#1a1a3a; padding:2px 14px; border-radius:20px; font-size:0.75rem; color:#99aabb;">${genre}</span>
                <span style="background:#1a1a3a; padding:2px 14px; border-radius:20px; font-size:0.75rem; color:#99aabb; margin-left:6px;">👤 ${author}</span>
            </div>
        </div>
        <hr style="border-color:#1a1a3a;">
        <div style="color:#c0d0e0; line-height:1.8;">${renderMarkdown(content)}</div>
    `;

    document.getElementById('previewContent').innerHTML = html;
    document.getElementById('previewArea').classList.add('active');
    document.getElementById('previewArea').scrollIntoView({ behavior: 'smooth' });
}

// ===== ПАРСЕР =====
function renderMarkdown(text) {
    text = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    text = text.replace(/^### (.*$)/gim, '<h4>$1</h4>');
    text = text.replace(/^## (.*$)/gim, '<h3>$1</h3>');
    text = text.replace(/^# (.*$)/gim, '<h2 style="color:#f5a623;">$1</h2>');
    text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');
    text = text.replace(/^- (.*$)/gim, '<li>$1</li>');
    text = text.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
    text = text.replace(/^\d+\. (.*$)/gim, '<li>$1</li>');
    text = text.replace(/(<li>.*<\/li>\n?)+/g, '<ol>$&</ol>');
    text = text.replace(/---/g, '<hr>');
    text = text.replace(/\n\n/g, '</p><p>');
    return '<p>' + text + '</p>';
}

// ===== ОЧИСТКА =====
function clearAll() {
    document.getElementById('title').value = '';
    document.getElementById('universe').value = '';
    document.getElementById('content').value = '';
    document.getElementById('author').value = 'Фанат Fanlogya';
    document.getElementById('icon').value = '🧬';
    document.getElementById('iconDisplay').textContent = '🧬';
    document.getElementById('previewArea').classList.remove('active');
    const status = document.getElementById('statusMessage');
    status.className = 'status';
    status.textContent = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ===== СТАТУС =====
function showStatus(msg, type) {
    const el = document.getElementById('statusMessage');
    el.textContent = msg;
    el.className = 'status ' + type;
    el.scrollIntoView({ behavior: 'smooth' });
}

// ===== ПУБЛИКАЦИЯ =====
async function publish() {
    // Проверка авторизации
    if (!currentUser) {
        showStatus('❌ Войди в аккаунт! Перейди на login.html', 'error');
        return;
    }

    const title = document.getElementById('title').value.trim();
    if (!title) {
        showStatus('❌ Введи название!', 'error');
        return;
    }

    const content = document.getElementById('content').value.trim();
    if (!content) {
        showStatus('❌ Напиши текст!', 'error');
        return;
    }

    const btn = document.getElementById('publishBtn');
    btn.disabled = true;
    btn.textContent = '⏳ Публикация...';
    showStatus('⏳ Отправка в Firebase...', 'loading');

    try {
        const data = {
            title: title,
            universe: document.getElementById('universe').value || 'Неизвестная вселенная',
            genre: document.getElementById('genre').value,
            icon: document.getElementById('icon').value || '📖',
            author: document.getElementById('author').value || 'Аноним',
            authorId: currentUser.uid,
            date: new Date().toLocaleDateString('ru-RU'),
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            likes: 0,
            pinned: false,
            content: content
        };

        await db.collection('lores').add(data);
        showStatus('✅ УСПЕХ! Хронология опубликована!', 'success');
        clearAll();

        if (window.opener) {
            try { window.opener.loadLibrary(); } catch(e) {}
        }

    } catch (error) {
        console.error('Ошибка:', error);
        showStatus('❌ Ошибка: ' + error.message, 'error');
    }

    btn.disabled = false;
    btn.textContent = '💾 Опубликовать';
}

// Закрываем пикер при клике вне его
document.addEventListener('click', function(e) {
    const picker = document.getElementById('emojiPicker');
    if (picker.style.display === 'grid') {
        if (!e.target.closest('.flex') && !e.target.closest('.emoji-grid')) {
            picker.style.display = 'none';
        }
    }
});
</script>

</body>
</html>
