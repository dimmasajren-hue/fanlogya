<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fanlogya — Смена пароля</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #0d0d1a;
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            border: 1px solid #1a1a3a;
        }
        h1 {
            color: #f5a623;
            text-align: center;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            color: #e0e8f0;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            background: #1a1a30;
            border: 1px solid #2a2a4a;
            border-radius: 12px;
            color: #e0e0e0;
            font-size: 1rem;
        }
        .form-group input:focus {
            outline: none;
            border-color: #e94560;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #e94560;
            border: none;
            border-radius: 30px;
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover {
            background: #ff5a7a;
            transform: scale(1.02);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            background: #1a1a3a;
            border: 1px solid #2a2a4a;
            margin-top: 10px;
        }
        .btn-secondary:hover {
            background: #2a2a4a;
        }
        .status {
            padding: 10px 14px;
            border-radius: 10px;
            margin-top: 12px;
            text-align: center;
            display: none;
        }
        .status.success {
            background: #0f3460;
            border: 1px solid #e94560;
            display: block;
            color: #aaddff;
        }
        .status.error {
            background: #3a0a0a;
            border: 1px solid #e94560;
            display: block;
            color: #ffaaaa;
        }
        .status.loading {
            background: #1a1a3a;
            border: 1px solid #f5a623;
            display: block;
            color: #f5a623;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: #e94560;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 Смена пароля</h1>
        <div id="userInfo" style="text-align:center;color:#667788;margin-bottom:16px;"></div>

        <form id="passwordForm" onsubmit="changePassword(event)">
            <div class="form-group">
                <label>📧 Email</label>
                <input type="email" id="emailInput" readonly style="opacity:0.6;cursor:not-allowed;">
            </div>
            <div class="form-group">
                <label>🔐 Новый пароль</label>
                <input type="password" id="newPasswordInput" placeholder="Минимум 6 символов" required minlength="6">
            </div>
            <div class="form-group">
                <label>🔐 Подтверди новый пароль</label>
                <input type="password" id="confirmPasswordInput" placeholder="Введи пароль ещё раз" required minlength="6">
            </div>
            <button type="submit" class="btn" id="submitBtn">💾 Сменить пароль</button>
        </form>

        <div id="statusMessage" class="status"></div>

        <a href="index.html" class="back-link">← На главную</a>
        <a href="#" class="back-link" onclick="sendResetEmail()">📧 Забыл пароль?</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCLNZLQA2c3dMtj5Z5tiLmEPD4zixi0gFc",
            authDomain: "fanlogya.firebaseapp.com",
            projectId: "fanlogya",
            storageBucket: "fanlogya.firebasestorage.app",
            messagingSenderId: "448128302344",
            appId: "1:448128302344:web:8f869fca95f1b00a1700bd"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        const userInfo = document.getElementById('userInfo');
        const emailInput = document.getElementById('emailInput');
        const newPassInput = document.getElementById('newPasswordInput');
        const confirmPassInput = document.getElementById('confirmPasswordInput');
        const submitBtn = document.getElementById('submitBtn');
        const statusEl = document.getElementById('statusMessage');

        // Проверяем, авторизован ли пользователь
        auth.onAuthStateChanged(user => {
            if (user) {
                userInfo.textContent = `👤 ${user.displayName || user.email || 'Пользователь'}`;
                emailInput.value = user.email || '';
                submitBtn.disabled = false;
            } else {
                userInfo.textContent = '❌ Ты не авторизован!';
                submitBtn.disabled = true;
                emailInput.value = 'Войди в аккаунт';
            }
        });

        function showStatus(msg, type) {
            statusEl.textContent = msg;
            statusEl.className = 'status ' + type;
        }

        async function changePassword(e) {
            e.preventDefault();
            const user = auth.currentUser;
            if (!user) {
                showStatus('❌ Войди в аккаунт!', 'error');
                return;
            }

            const newPass = newPassInput.value;
            const confirmPass = confirmPasswordInput.value;

            if (newPass.length < 6) {
                showStatus('❌ Пароль должен быть минимум 6 символов', 'error');
                return;
            }

            if (newPass !== confirmPass) {
                showStatus('❌ Пароли не совпадают!', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Обновление...';
            showStatus('⏳ Обновляем пароль...', 'loading');

            try {
                await user.updatePassword(newPass);
                showStatus('✅ Пароль успешно изменён!', 'success');
                newPassInput.value = '';
                confirmPassInput.value = '';
                submitBtn.textContent = '✅ Готово!';
            } catch (error) {
                let msg = error.message;
                if (error.code === 'auth/requires-recent-login') {
                    msg = '❌ Для безопасности войди заново и попробуй снова!';
                }
                showStatus('❌ Ошибка: ' + msg, 'error');
                submitBtn.textContent = '💾 Сменить пароль';
            }

            submitBtn.disabled = false;
            setTimeout(() => {
                submitBtn.textContent = '💾 Сменить пароль';
            }, 3000);
        }

        // ===== ВОССТАНОВЛЕНИЕ ПАРОЛЯ =====
        function sendResetEmail() {
            const email = prompt('📧 Введи свой email для восстановления пароля:');
            if (!email) return;

            showStatus('⏳ Отправка письма...', 'loading');
            auth.sendPasswordResetEmail(email).then(() => {
                showStatus(`✅ Письмо отправлено на ${email}. Проверь почту!`, 'success');
            }).catch((error) => {
                let msg = error.message;
                if (error.code === 'auth/user-not-found') {
                    msg = '❌ Пользователь с таким email не найден';
                }
                showStatus('❌ Ошибка: ' + msg, 'error');
            });
        }
    </script>
</body>
</html>
