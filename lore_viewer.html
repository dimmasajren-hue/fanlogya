<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fanlogya — Просмотр хронологии</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .container { max-width: 900px; margin: 0 auto; padding: 30px 20px; }
        .viewer-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .viewer-header .icon { font-size: 4rem; }
        .viewer-header .info h2 { color: #f5a623; font-size: 2rem; }
        .viewer-header .info p { color: #8899aa; }
        .viewer-header .info .tags { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
        .viewer-header .info .tags span { background: #1a1a3a; padding: 3px 16px; border-radius: 20px; font-size: 0.75rem; border: 1px solid #2a2a4a; color: #99aabb; }
        .lore-content { background: #0d0d1a; border-radius: 16px; padding: 40px; border: 1px solid #1a1a3a; line-height: 1.8; color: #c0d0e0; }
        .lore-content h2 { color: #f5a623; margin: 20px 0 10px; }
        .lore-content h3 { color: #e94560; margin: 20px 0 10px; }
        .lore-content h4 { color: #e0e8f0; margin: 15px 0 8px; }
        .lore-content ul, .lore-content ol { margin: 10px 0 20px 25px; }
        .lore-content li { margin-bottom: 6px; }
        .lore-content hr { border-color: #1a1a3a; margin: 20px 0; }
        .lore-content .highlight { background: #1a1a3a; border-left: 4px solid #e94560; padding: 16px 22px; border-radius: 8px; margin: 20px 0; font-style: italic; color: #ddeeff; }
        .back-btn { display: inline-block; background: #1a1a3a; color: #e0e8f0; padding: 10px 24px; border-radius: 30px; text-decoration: none; font-weight: 600; margin-bottom: 20px; transition: 0.3s; border: 1px solid #2a2a4a; }
        .back-btn:hover { background: #e94560; border-color: #e94560; color: #fff; }
        @media (max-width:700px){ .lore-content { padding: 20px; } .viewer-header { flex-direction: column; text-align: center; } }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-btn">← Назад к библиотеке</a>

        <div id="loreViewer">
            <div style="text-align:center; padding:60px 20px; color:#667788;">
                <span style="font-size:3rem;">⏳</span>
                <p>Загрузка хронологии...</p>
            </div>
        </div>
    </div>

    <script>
        // ===== ЗАГРУЗКА ХРОНОЛОГИИ ИЗ sessionStorage =====
        document.addEventListener('DOMContentLoaded', function() {
            const data = sessionStorage.getItem('current_lore');
            if (!data) {
                document.getElementById('loreViewer').innerHTML = `
                    <div style="text-align:center; padding:60px 20px; color:#667788;">
                        <span style="font-size:3rem;">❌</span>
                        <p>Хронология не найдена. Вернись в библиотеку.</p>
                        <a href="index.html" style="color:#e94560; font-weight:600;">На главную →</a>
                    </div>
                `;
                return;
            }

            const lore = JSON.parse(data);
            const content = renderMarkdown(lore.content);

            document.getElementById('loreViewer').innerHTML = `
                <div class="viewer-header">
                    <span class="icon">${lore.icon || '📖'}</span>
                    <div class="info">
                        <h2>${lore.title}</h2>
                        <p>${lore.universe || 'Неизвестная вселенная'}</p>
                        <div class="tags">
                            <span>${lore.genre || 'Без жанра'}</span>
                            <span>👤 ${lore.author || 'Аноним'}</span>
                            <span>📅 ${lore.date || 'Неизвестно'}</span>
                        </div>
                    </div>
                </div>
                <div class="lore-content">${content}</div>
            `;
        });

        // ===== ПРОСТОЙ ПАРСЕР МАРКДАУНА (такой же как в редакторе) =====
        function renderMarkdown(text) {
            if (!text) return '<p>Текст хронологии пуст.</p>';
            
            let html = text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/^### (.*$)/gim, '<h4>$1</h4>')
                .replace(/^## (.*$)/gim, '<h3>$1</h3>')
                .replace(/^# (.*$)/gim, '<h2>$1</h2>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/^- (.*$)/gim, '<li>$1</li>')
                .replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>')
                .replace(/^\d+\. (.*$)/gim, '<li>$1</li>')
                .replace(/(<li>.*<\/li>\n?)+/g, '<ol>$&</ol>')
                .replace(/---/g, '<hr>')
                .replace(/\n\n/g, '</p><p>');
            
            return '<p>' + html + '</p>';
        }
    </script>

</body>
</html>
